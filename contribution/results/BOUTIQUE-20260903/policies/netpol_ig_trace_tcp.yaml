apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend
  namespace: boutique
  labels: {thesis.ankra.dev/generated-from: ig_trace_tcp, thesis.ankra.dev/journey: A}
spec:
  podSelector: {matchLabels: {app: frontend}}
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector: {matchLabels: {app: loadgenerator}}
    ports: [{port: 80, protocol: TCP}]
