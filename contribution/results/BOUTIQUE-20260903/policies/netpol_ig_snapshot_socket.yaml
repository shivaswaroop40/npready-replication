apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-adservice
  namespace: boutique
  labels: {thesis.ankra.dev/generated-from: ig_snapshot_socket, thesis.ankra.dev/journey: A}
spec:
  podSelector: {matchLabels: {app: adservice}}
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector: {matchLabels: {app: frontend}}
    ports: [{port: 9555, protocol: TCP}]
