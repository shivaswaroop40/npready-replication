# perfbench steady generator for bank: thesis journey A as a Job pinned to cp-01.
# Generated by apps/tools/prepare.py from results/BANK-20260904/workloads/loadgenerator-a.yaml (Deployment/loadgenerator-a).
# Placeholder: ${STEADY_SECONDS} (whole Job duration; locust run-time / wrk2 -d).
# Collect with: kubectl -n bank logs job/pb-steady  (markers PB_STEADY_BEGIN, PB_STEADY_RC, === PB_FILE <name> ===, === PB_END ===)
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pb-steady
  namespace: bank
  labels:
    app.kubernetes.io/part-of: perfbench
    perfbench/role: steady
    perfbench/app: bank
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: loadgenerator
        journey: A
        app.kubernetes.io/part-of: perfbench
        perfbench/role: steady
        perfbench/app: bank
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: cp-01
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: loadgenerator
        image: us-central1-docker.pkg.dev/bank-of-anthos-ci/bank-of-anthos/loadgenerator:v0.6.10@sha256:dd7e27f1b1bcbb9c85070eb900a6060d098d06d62ef03f98182424919895df83
        env:
        - name: FRONTEND_ADDR
          value: frontend:80
        - name: USERS
          value: '5'
        - name: LOG_LEVEL
          value: info
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: locustfile
          mountPath: /app/locustfile.py
          subPath: locustfile.py
          readOnly: true
        - name: pb-out
          mountPath: /tmp/pb
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        args:
        - |
          echo "PB_STEADY_BEGIN epoch=$(date +%s) app=bank kind=locust users=5 rate=1 seconds=${STEADY_SECONDS}"
          locust -f /app/locustfile.py --host=http://frontend:80 --headless -u 5 -r 1 --loglevel info --run-time ${STEADY_SECONDS}s --only-summary --csv /tmp/pb/steady --exit-code-on-error 0
          echo $? > /tmp/pb/rc
          echo "PB_STEADY_RC=$(cat /tmp/pb/rc) epoch=$(date +%s)"
          echo "=== PB_FILE steady_stats.csv ==="
          cat /tmp/pb/steady_stats.csv
          echo "=== PB_FILE steady_failures.csv ==="
          cat /tmp/pb/steady_failures.csv
          echo "=== PB_FILE steady_exceptions.csv ==="
          cat /tmp/pb/steady_exceptions.csv
          echo "=== PB_FILE steady_stats_history.csv ==="
          cat /tmp/pb/steady_stats_history.csv
          echo "=== PB_END ==="
          exit "$(cat /tmp/pb/rc)"
      volumes:
      - name: locustfile
        configMap:
          name: locustfile-a
      - name: pb-out
        emptyDir: {}
