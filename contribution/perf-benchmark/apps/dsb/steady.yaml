# perfbench steady generator for dsb: thesis journey A as a Job pinned to cp-01.
# Generated by apps/tools/prepare.py from results/DSB-SOCIAL-20260904/workloads/wrk2-A.yaml (Deployment/wrk2-a).
# Placeholder: ${STEADY_SECONDS} (whole Job duration; locust run-time / wrk2 -d).
# Collect with: kubectl -n dsb logs job/pb-steady  (markers PB_STEADY_BEGIN, PB_STEADY_RC, === PB_FILE <name> ===, === PB_END ===)
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pb-steady
  namespace: dsb
  labels:
    app.kubernetes.io/part-of: perfbench
    perfbench/role: steady
    perfbench/app: dsb
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: wrk2-client
        journey: A
        app.kubernetes.io/part-of: perfbench
        perfbench/role: steady
        perfbench/app: dsb
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: cp-01
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      containers:
      - name: wrk2
        image: deathstarbench/wrk2-client:latest
        command:
        - /bin/sh
        - -c
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        - name: pb-out
          mountPath: /tmp/pb
        imagePullPolicy: IfNotPresent
        args:
        - |
          echo "PB_STEADY_BEGIN epoch=$(date +%s) app=dsb kind=wrk2 users=- rate=20 seconds=${STEADY_SECONDS}"
          /usr/local/bin/wrk -D exp -t 2 -c 8 -d ${STEADY_SECONDS}s -L -s /scripts/read-home-timeline.lua http://nginx-thrift.dsb.svc.cluster.local:8080/wrk2-api/home-timeline/read -R 20
          echo $? > /tmp/pb/rc
          echo "PB_STEADY_RC=$(cat /tmp/pb/rc) epoch=$(date +%s)"
          echo "=== PB_END ==="
          exit "$(cat /tmp/pb/rc)"
      volumes:
      - name: scripts
        configMap:
          name: wrk2-scripts
      - name: pb-out
        emptyDir: {}
