# perfbench steady generator for boutique: thesis journey A as a Job pinned to cp-01.
# Generated by apps/tools/prepare.py from results/BOUTIQUE-20260903/manifests/online-boutique-v0.10.6.yaml (Deployment/loadgenerator).
# Placeholder: ${STEADY_SECONDS} (whole Job duration; locust run-time / wrk2 -d).
# Collect with: kubectl -n boutique logs job/pb-steady  (markers PB_STEADY_BEGIN, PB_STEADY_RC, === PB_FILE <name> ===, === PB_END ===)
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pb-steady
  namespace: boutique
  labels:
    app.kubernetes.io/part-of: perfbench
    perfbench/role: steady
    perfbench/app: boutique
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: loadgenerator
        journey: A
        app.kubernetes.io/part-of: perfbench
        perfbench/role: steady
        perfbench/app: boutique
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: cp-01
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      serviceAccountName: loadgenerator
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: main
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
        image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/loadgenerator:v0.10.6
        env:
        - name: FRONTEND_ADDR
          value: frontend:80
        - name: USERS
          value: '10'
        - name: RATE
          value: '1'
        resources:
          requests:
            cpu: 300m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        args:
        - |
          echo "PB_STEADY_BEGIN epoch=$(date +%s) app=boutique kind=locust users=10 rate=1 seconds=${STEADY_SECONDS}"
          locust -f /loadgen/locustfile.py --host=http://frontend:80 --headless -u 10 -r 1 --run-time ${STEADY_SECONDS}s --only-summary --csv /tmp/pb/steady --exit-code-on-error 0
          echo $? > /tmp/pb/rc
          echo "PB_STEADY_RC=$(cat /tmp/pb/rc) epoch=$(date +%s)"
          echo "=== PB_FILE steady_stats.csv ==="
          cat /tmp/pb/steady_stats.csv
          echo "=== PB_FILE steady_failures.csv ==="
          cat /tmp/pb/steady_failures.csv
          echo "=== PB_FILE steady_exceptions.csv ==="
          cat /tmp/pb/steady_exceptions.csv
          echo "=== PB_FILE steady_stats_history.csv ==="
          cat /tmp/pb/steady_stats_history.csv
          echo "=== PB_END ==="
          exit "$(cat /tmp/pb/rc)"
        volumeMounts:
        - name: pb-out
          mountPath: /tmp/pb
      volumes:
      - name: pb-out
        emptyDir: {}
