# perfbench fixed-count test for boutique: hey, N requests at concurrency C against TP_URL.
# Generated by apps/tools/prepare.py. Placeholders: ${TP_N} ${TP_C} ${TP_FLAGS}
#   TP_FLAGS: empty = keep-alive (16 persistent connections); -disable-keepalive = new
#   connection per request. hey runs N/C requests per worker, so N must be a multiple of C.
# Collect with: kubectl -n boutique logs job/pb-tp  (markers PB_TP_BEGIN, PB_TP_RC, === PB_END ===)
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pb-tp
  namespace: boutique
  labels:
    app.kubernetes.io/part-of: perfbench
    perfbench/role: throughput
    perfbench/app: boutique
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: perfbench
        perfbench/role: throughput
        perfbench/app: boutique
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: cp-01
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      terminationGracePeriodSeconds: 5
      containers:
      - name: hey
        image: williamyeh/hey@sha256:6e63ae9c5801204cf7abe22c9ddf82d1bcbc7140ffd206a9bd83a8a643dcd6f2
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        args:
        - |
          echo "PB_TP_BEGIN epoch=$(date +%s) app=boutique n=${TP_N} c=${TP_C} flags=[${TP_FLAGS}] url=http://frontend:80/product/OLJCESPC7Z"
          /hey -n ${TP_N} -c ${TP_C} ${TP_FLAGS} -disable-redirects 'http://frontend:80/product/OLJCESPC7Z'
          echo $? > /tmp/rc
          echo "PB_TP_RC=$(cat /tmp/rc) epoch=$(date +%s)"
          echo "=== PB_END ==="
          exit "$(cat /tmp/rc)"
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            memory: 256Mi
