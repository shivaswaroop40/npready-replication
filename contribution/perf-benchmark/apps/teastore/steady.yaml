# perfbench steady generator for teastore: thesis journey A as a Job pinned to cp-01.
# Generated by apps/tools/prepare.py from results/TEASTORE-20260906/workloads/loadgen-a.yaml (Deployment/loadgen-a).
# Placeholder: ${STEADY_SECONDS} (whole Job duration; locust run-time / wrk2 -d).
# Collect with: kubectl -n teastore logs job/pb-steady  (markers PB_STEADY_BEGIN, PB_STEADY_RC, === PB_FILE <name> ===, === PB_END ===)
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pb-steady
  namespace: teastore
  labels:
    app.kubernetes.io/part-of: perfbench
    perfbench/role: steady
    perfbench/app: teastore
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        run: load-test
        journey: A
        app.kubernetes.io/part-of: perfbench
        perfbench/role: steady
        perfbench/app: teastore
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: cp-01
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      containers:
      - name: locust
        image: locustio/locust:2.31.5
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: lf
          mountPath: /mnt/locustfile.py
          subPath: locustfile.py
          readOnly: true
        - name: pb-out
          mountPath: /tmp/pb
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        args:
        - |
          echo "PB_STEADY_BEGIN epoch=$(date +%s) app=teastore kind=locust users=8 rate=2 seconds=${STEADY_SECONDS}"
          locust -f /mnt/locustfile.py --host=http://teastore-webui:8080 --headless -u 8 -r 2 --run-time ${STEADY_SECONDS}s --only-summary --csv /tmp/pb/steady --exit-code-on-error 0
          echo $? > /tmp/pb/rc
          echo "PB_STEADY_RC=$(cat /tmp/pb/rc) epoch=$(date +%s)"
          echo "=== PB_FILE steady_stats.csv ==="
          cat /tmp/pb/steady_stats.csv
          echo "=== PB_FILE steady_failures.csv ==="
          cat /tmp/pb/steady_failures.csv
          echo "=== PB_FILE steady_exceptions.csv ==="
          cat /tmp/pb/steady_exceptions.csv
          echo "=== PB_FILE steady_stats_history.csv ==="
          cat /tmp/pb/steady_stats_history.csv
          echo "=== PB_END ==="
          exit "$(cat /tmp/pb/rc)"
      volumes:
      - name: lf
        configMap:
          name: locustfile-a
      - name: pb-out
        emptyDir: {}
